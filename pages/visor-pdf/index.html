<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de PDF</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="barra">
    <h1>Visor de PDF</h1>
    <div class="controles">
      <label for="selector-pdf">Documento:</label>
      <select id="selector-pdf"></select>
      <a id="enlace-abrir" href="#" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
      <a id="enlace-descargar" href="#" download>Descargar</a>
    </div>
  </header>

  <main class="contenedor">
    <object id="visor" type="application/pdf" data="">
      <!-- Respaldo si el navegador no puede mostrar PDFs incrustados -->
      <div class="respaldo">
        <p>Tu navegador no puede mostrar el PDF aquí.</p>
        <a id="enlace-respaldo" href="#" target="_blank" rel="noopener">Abrir el PDF</a>
      </div>
    </object>
  </main>

  <script src="js/main.js"></script>
</body>
</html>

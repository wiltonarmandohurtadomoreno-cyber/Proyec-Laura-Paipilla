  <script>
// ---- src/sonido.js
// Efectos de sonido sintetizados (no necesitan archivos de audio).
const Sonido = {
  ctx: null,

  tono(freq, dur = 0.12, tipo = 'sine', vol = 0.15, retraso = 0) {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const c = this.ctx;
      const o = c.createOscillator();
      const g = c.createGain();
      const t = c.currentTime + retraso;
      o.type = tipo;
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(c.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    } catch (e) { /* sin audio */ }
  },

  bien()    { this.tono(660, 0.12, 'triangle'); this.tono(880, 0.2, 'triangle', 0.15, 0.1); },
  mal()     { this.tono(200, 0.25, 'sawtooth', 0.06); },

// ---- src/dibujos.js
// =====================================================================
//  DIBUJOS GENERADOS POR CÓDIGO
//  Los útiles escolares, los planetas, el Sol y algunos adornos se
//  dibujan con canvas al iniciar, así no hacen falta más imágenes.
//  Se dibujan al doble de resolución (R = 2) para que se vean nítidos;
//  por eso en el juego se muestran con escala 0.5.
// =====================================================================
const Dibujos = {
  R: 2,

  lienzo(scene, key, w, h, dibujar) {
    if (scene.textures.exists(key)) return;
    const R = this.R;
    const tex = scene.textures.createCanvas(key, Math.ceil(w * R), Math.ceil(h * R));
    const ctx = tex.getContext();
    ctx.save();
    ctx.scale(R, R);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    dibujar(ctx, w, h);
    ctx.restore();
    tex.refresh();
  },

  rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },

  // Escala para que una textura quepa en un cuadro de "max" píxeles
  ajustar(scene, key, max) {
    const f = scene.textures.getFrame(key);
    return max / Math.max(f.width, f.height);

      ctx.fillStyle = '#1e3fbf'; ctx.fillRect(20, 10.5, 70, 3);
      rr(ctx, 86, 5, 22, 14, 5); ctx.fillStyle = '#1e3fbf'; ctx.fill(); ctx.stroke();

    });

    this.lienzo(scene, 'util_colores', 92, 74, (ctx) => {
      const colores = [['#e53935', '#ff7a73', '#a52420'], ['#43a047', '#7fd383', '#2c6e30'], ['#1e88e5', '#7cc0ff', '#155fa0']];
      colores.forEach((c, i) => {
        ctx.save();
        ctx.translate(46, 66);
        ctx.rotate(-Math.PI / 2 + (i - 1) * 0.42);
        ctx.translate(-8, -14);
        ctx.scale(0.62, 1);
        // lápiz de color en vertical: dibujado como el lápiz pero apuntando a la derecha
        ctx.beginPath(); ctx.moveTo(78, 4); ctx.lineTo(98, 14); ctx.lineTo(78, 24); ctx.closePath();
        ctx.fillStyle = '#f3c48d'; ctx.fill(); ctx.strokeStyle = borde; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(91, 10.5); ctx.lineTo(98, 14); ctx.lineTo(91, 17.5); ctx.closePath();
        ctx.fillStyle = c[0]; ctx.fill();
        ctx.fillStyle = c[0]; ctx.fillRect(4, 4, 74, 20);
        ctx.fillStyle = c[1]; ctx.fillRect(4, 4, 74, 6);
        ctx.fillStyle = c[2]; ctx.fillRect(4, 18, 74, 6);
        ctx.strokeRect(4, 4, 74, 20);
        ctx.restore();
      });
    });

    this.lienzo(scene, 'util_regla', 132, 30, (ctx) => {
      rr(ctx, 3, 4, 126, 22, 3); ctx.fillStyle = 'rgba(255,214,79,.97)'; ctx.fill();
      ctx.strokeStyle = '#9c7400'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.lineWidth = 1;
      for (let i = 0; i <= 20; i++) {
        const x = 8 + i * 5.8;
        ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, i % 5 === 0 ? 14 : 9); ctx.stroke();
      }
    });

    this.lienzo(scene, 'util_cuaderno', 66, 80, (ctx) => {
      rr(ctx, 9, 4, 52, 70, 5); ctx.fillStyle = '#ff7043'; ctx.fill();
      ctx.strokeStyle = '#7a2b10'; ctx.lineWidth = 1.8; ctx.stroke();

      [28, 34].forEach(y => { ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(50, y); ctx.stroke(); });

  // ---------------------------------------------------------- planetas
  dibujarPlaneta(ctx, p, cx, cy) {
    const r = p.r;
    const anillo = (mitad) => {
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(-0.35);
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.9, r * 0.55, 0, mitad === 'atras' ? Math.PI : 0, mitad === 'atras' ? Math.PI * 2 : Math.PI);
      ctx.strokeStyle = '#cdb27a'; ctx.lineWidth = r * 0.3; ctx.stroke();
      ctx.strokeStyle = '#efdcae'; ctx.lineWidth = r * 0.1; ctx.stroke();
      ctx.restore();
    };
    if (p.id === 'saturno') anillo('atras');

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    const banda = (dy, h, color) => { ctx.fillStyle = color; ctx.fillRect(cx - r, cy + dy * r, r * 2, h * r); };
    const mancha = (dx, dy, rx, ry, color) => {
      ctx.beginPath(); ctx.ellipse(cx + dx * r, cy + dy * r, rx * r, ry * r, 0.3, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
    };
    const base = {
      mercurio: '#a8a8a8', venus: '#e9c27c', tierra: '#2f7de1', marte: '#d4573b',
      jupiter: '#d8a46e', saturno: '#e8cf8f', urano: '#93dde6', neptuno: '#3d6fdc'
    }[p.id];
    ctx.fillStyle = base; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    switch (p.id) {
      case 'mercurio':
        mancha(-0.3, -0.2, 0.22, 0.2, '#8d8d8d'); mancha(0.35, 0.3, 0.16, 0.15, '#8d8d8d'); mancha(0.1, -0.55, 0.12, 0.1, '#919191');
        break;
      case 'venus':
        banda(-0.5, 0.25, '#f3d9a4'); banda(0.1, 0.3, '#dcae62'); banda(0.6, 0.2, '#f3d9a4');
        break;
      case 'tierra':
        mancha(-0.35, -0.15, 0.35, 0.45, '#3fae4a'); mancha(0.45, 0.25, 0.3, 0.38, '#3fae4a'); mancha(0.1, -0.6, 0.25, 0.15, '#3fae4a');
        banda(-1, 0.22, '#f2f6ff'); banda(0.85, 0.2, '#f2f6ff');
        break;
      case 'marte':
        mancha(-0.25, 0.1, 0.3, 0.2, '#a83e28'); mancha(0.4, -0.3, 0.18, 0.14, '#a83e28'); banda(-1, 0.18, '#ffe9e0');
        break;
      case 'jupiter':
        banda(-0.75, 0.18, '#b9784a'); banda(-0.4, 0.22, '#f1d2a6'); banda(-0.05, 0.2, '#a8643c');
        banda(0.3, 0.25, '#f1d2a6'); banda(0.65, 0.15, '#b9784a');
        mancha(0.35, 0.42, 0.2, 0.11, '#c2492f');
        break;
      case 'saturno':
        banda(-0.6, 0.2, '#d6b56d'); banda(-0.1, 0.25, '#f3e2b5'); banda(0.45, 0.2, '#d6b56d');
        break;
      case 'urano':
        banda(-0.2, 0.3, '#a9e8ee');
        break;
      case 'neptuno':
        banda(-0.3, 0.2, '#2e57b5'); banda(0.4, 0.15, '#5585ea'); mancha(-0.3, 0.1, 0.16, 0.1, '#20408a');
        break;
    }
    // sombreado para que se vea redondo
    const g = ctx.createRadialGradient(cx - r * 0.4, cy - r * 0.4, r * 0.1, cx, cy, r);
    g.addColorStop(0, 'rgba(255,255,255,0.35)');
    g.addColorStop(0.5, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(0,0,30,0.5)');
    ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx.restore();

    if (p.id === 'saturno') anillo('frente');
  },

  crearPlanetas(scene) {
    PLANETAS.forEach(p => {
      const w = (p.id === 'saturno' ? p.r * 4.3 : p.r * 2) + 6;
      const h = p.r * 2 + 6;
      this.lienzo(scene, 'planeta_' + p.id, w, h, (ctx) => this.dibujarPlaneta(ctx, p, w / 2, h / 2));
    });

    this.lienzo(scene, 'sol', 200, 200, (ctx) => {
      const brillo = ctx.createRadialGradient(100, 100, 50, 100, 100, 100);
      brillo.addColorStop(0, 'rgba(255,200,40,0.6)');
      brillo.addColorStop(1, 'rgba(255,140,0,0)');
      ctx.fillStyle = brillo; ctx.fillRect(0, 0, 200, 200);
      const g = ctx.createRadialGradient(85, 85, 5, 100, 100, 62);
      g.addColorStop(0, '#fff7c2'); g.addColorStop(0.5, '#ffd23f'); g.addColorStop(1, '#ff8a1e');
      ctx.beginPath(); ctx.arc(100, 100, 62, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    });
  },

  // ----------------------------------------------------------- adornos
  crearAdornos(scene) {
    this.lienzo(scene, 'sombra', 70, 18, (ctx) => {
      const g = ctx.createRadialGradient(35, 9, 2, 35, 9, 35);
      g.addColorStop(0, 'rgba(0,0,0,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.save(); ctx.scale(1, 18 / 70); ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(35, 35, 35, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    });

    this.lienzo(scene, 'brillo', 30, 30, (ctx) => {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(15, 0); ctx.quadraticCurveTo(17, 13, 30, 15); ctx.quadraticCurveTo(17, 17, 15, 30);
      ctx.quadraticCurveTo(13, 17, 0, 15); ctx.quadraticCurveTo(13, 13, 15, 0);
      ctx.fill();
    });

    const estrella = (ctx, relleno, borde) => {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rad = i % 2 === 0 ? 30 : 13;
        ctx.lineTo(32 + Math.cos(a) * rad, 34 + Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fillStyle = relleno; ctx.fill();
      ctx.strokeStyle = borde; ctx.lineWidth = 3; ctx.stroke();
    };
    this.lienzo(scene, 'estrella', 64, 64, (ctx) => estrella(ctx, '#ffd23f', '#c98a00'));
    this.lienzo(scene, 'estrellaVacia', 64, 64, (ctx) => estrella(ctx, 'rgba(255,255,255,0.08)', '#5b6699'));

    this.lienzo(scene, 'confeti', 10, 6, (ctx) => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 10, 6); });
  }
};

// Utilidades de interfaz: estilos de texto y botones reutilizables.
const FUENTE = '"Fredoka", "Trebuchet MS", Arial, sans-serif';
const TIZA = '"Patrick Hand", "Comic Sans MS", cursive';

const COLOR = {
  boton: 0x34419c,
  verde: 0x2fbf71,
  rojo: 0xe0484f,
  panel: 0x0b1033,
  tarjeta: 0x1d2a6b,
  borde: 0x6fd3ff
};

const T = (tam, color = '#ffffff', extra = {}) =>
  Object.assign({ fontFamily: FUENTE, fontSize: tam + 'px', color }, extra);

const TZ = (tam, color = '#f4f7f2', extra = {}) =>
  Object.assign({ fontFamily: TIZA, fontSize: tam + 'px', color }, extra);

const UI = {
  texturaBoton(scene, w, h) {
    const key = `boton_${w}x${h}`;
    if (!scene.textures.exists(key)) {
      const g = scene.make.graphics({ x: 0, y: 0 }, false);
      g.fillStyle(0xb8b8b8, 1).fillRoundedRect(0, 0, w, h, 16);
      g.fillStyle(0xffffff, 1).fillRoundedRect(0, 0, w, h - 6, 16);
      g.generateTexture(key, w, h);
      g.destroy();
    }
    return key;
  },

  // Crea un botón (imagen + texto). Devuelve un objeto con helpers.
  boton(scene, x, y, texto, { w = 320, h = 70, color = COLOR.boton, tam = 28 } = {}) {
    const img = scene.add.image(x, y, this.texturaBoton(scene, w, h)).setTint(color);
    const txt = scene.add.text(x, y - 3, texto, T(tam, '#ffffff', { fontStyle: '600' })).setOrigin(0.5);
    img.setInteractive({ useHandCursor: true });

    const b = {
      img, txt,
      colorBase: color,
      color,
      activo: true,
      setColor(c) { this.color = c; img.setTint(c); return this; },
      reset() { this.activo = true; this.setColor(this.colorBase); return this; },
      mover(nx, ny) { img.setPosition(nx, ny); txt.setPosition(nx, ny - 3); return this; },
      alClic(fn) { img.on('pointerup', () => { if (this.activo) fn(); }); return this; },
      partes() { return [img, txt]; }
    };
    img.on('pointerover', () => {
      if (b.activo) img.setTint(Phaser.Display.Color.ValueToColor(b.color).lighten(12).color);
    });
    img.on('pointerout', () => img.setTint(b.color));
    return b;
  }
};

// ---- src/escenas/Carga.js
// Pantalla de carga: muestra el sprite loading.png y avanza sus cuadros
// (barra vacía -> 1 -> 2 -> 3 bloques) según el progreso de la carga
// del fondo y del personaje.
class Carga extends Phaser.Scene {
  constructor() { super('Carga'); }

  create() {
    const { width, height } = this.scale;
    this.cameras.main.setBackgroundColor('#26e7f5');

    // Tiempo mínimo en pantalla para que la animación se alcance a ver
    // aunque las imágenes carguen instantáneamente.
    this.TIEMPO_MINIMO = 2600;

    this.tarjeta = this.add.sprite(width / 2, height / 2 - 20, 'loading', 0).setScale(0.72);
    this.porcentaje = this.add.text(width / 2, height / 2 + 255, '0%', T(34, '#0b5f3a', { fontStyle: '600' }))
      .setOrigin(0.5);

    this.progresoReal = 0;
    this.cuadroActual = 0;
    this.listo = false;
    this.terminado = false;
    this.inicio = this.time.now;

    // Dibujos generados por código (útiles, planetas, estrellas...)
    Dibujos.crearTodo(this);

    // Carga del fondo y del personaje
    this.load.image('fondo', RUTAS.fondo);
    this.load.image('personaje', RUTAS.personaje);
    this.load.on('progress', (v) => { this.progresoReal = v; });
    this.load.once('complete', () => {
      // El dibujo del niño ocupa solo la parte de arriba de personaje.png;
      // creamos un "frame" recortado para usar únicamente esa zona.
      this.textures.get('personaje').add('cuerpo', 0, 26, 5, 120, 242);
      this.listo = true;
    });
    this.load.start();
  }

  update(time) {
    if (this.terminado) return;

    const avanceTiempo = Math.min(1, (time - this.inicio) / this.TIEMPO_MINIMO);
    const p = Math.min(this.progresoReal, avanceTiempo);

    // 4 cuadros: 0% -> cuadro 0, 33% -> 1, 66% -> 2, 100% -> 3
    const cuadro = Math.min(3, Math.floor(p * 3 + 0.0001));
    if (cuadro !== this.cuadroActual) {
      this.cuadroActual = cuadro;
      this.tarjeta.setFrame(cuadro);
      this.tweens.add({ targets: this.tarjeta, scale: { from: 0.75, to: 0.72 }, duration: 220, ease: 'Back.out' });
    }
    this.porcentaje.setText(Math.round(p * 100) + '%');

    if (this.listo && p >= 1) {
      this.terminado = true;
      this.time.delayedCall(450, () => {
        this.cameras.main.fadeOut(400, 38, 231, 245);
        this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Juego'));
      });
    }
  }
}

// ---- src/escenas/Juego.js
// Escena principal: el aula, el personaje y los útiles escolares.
class Juego extends Phaser.Scene {
  constructor() { super('Juego'); }

  create() {
    this.VELOCIDAD = 270;            // píxeles por segundo
    this.estrellas = 0;
    this.indice = 0;
    this.bloqueado = true;           // se desbloquea al asignar la primera misión
    this.destino = null;
    this.pasoT = 0;
    this.siguienteAviso = 0;

    this.add.image(0, 0, 'fondo').setOrigin(0);

    // Orden aleatorio de las misiones
    this.orden = Phaser.Utils.Array.Shuffle(UTILES.slice());

    this.crearUtiles();
    this.crearPersonaje();
    this.crearPizarra();
    this.crearBurbuja();
    this.crearControles();

    this.cameras.main.fadeIn(400, 38, 231, 245);
    this.time.delayedCall(350, () => this.siguienteMision(true));
  }

  // ------------------------------------------------------------ montaje
  crearUtiles() {
    this.items = UTILES.map((u, i) => {
      const sombra = this.add.image(u.x, u.y + 2, 'sombra').setScale(0.5).setDepth(u.y - 1);
      const s = this.add.image(u.x, u.y, 'util_' + u.id)
        .setOrigin(0.5, 0.85).setScale(0.5).setAngle(u.angulo || 0).setDepth(u.y);
      s.datos = u;
      s.sombra = sombra;
      s.recogido = false;

      // flota suavemente para que se note que se puede recoger
      this.tweens.add({ targets: s, y: u.y - 7, duration: 900 + i * 70, yoyo: true, repeat: -1, ease: 'Sine.inOut' });

      s.brillo = this.add.image(u.x + 22, u.y - 26, 'brillo').setScale(0.25).setDepth(u.y + 1).setAlpha(0);
      this.tweens.add({
        targets: s.brillo, alpha: 0.95, scale: 0.45, angle: 90,
        duration: 600, yoyo: true, repeat: -1, repeatDelay: 900 + i * 230, delay: i * 300
      });
      return s;
    });
  }

  crearPersonaje() {
    this.sombraPj = this.add.image(110, 565, 'sombra');
    this.pj = this.add.image(110, 565, 'personaje', 'cuerpo').setOrigin(0.5, 1);
    this.ajustarPerspectiva();
  }

  crearPizarra() {
    // La pizarra del fondo va de x=242 a 935 y de y=100 a 362
    const cx = 588;
    this.txtMision = this.add.text(cx, 130, '', TZ(26, '#cfe8d0')).setOrigin(0.5);
    this.txtBusca = this.add.text(cx + 30, 192, '', TZ(46)).setOrigin(0.5);
    this.iconoBusca = this.add.image(cx, 192, 'util_lapiz').setVisible(false);
    this.txtEstrellas = this.add.text(915, 128, '★ 0', TZ(30, '#ffe066')).setOrigin(1, 0.5);
    this.add.text(cx, 345, 'Camina con las flechas / WASD o toca el piso', TZ(19, '#a9c9ad')).setOrigin(0.5);

    // casillas con todos los útiles (se iluminan al recogerlos)
    this.slots = {};
    const n = this.orden.length;
    const sep = 86;
    const g = this.add.graphics();
    this.orden.forEach((u, i) => {
      const x = cx - ((n - 1) * sep) / 2 + i * sep;
      const y = 278;
      g.lineStyle(2, 0xffffff, 0.35).strokeCircle(x, y, 34);
      const escala = Dibujos.ajustar(this, 'util_' + u.id, 54);
      const icono = this.add.image(x, y, 'util_' + u.id).setScale(escala).setAlpha(0.22);
      this.slots[u.id] = { x, y, escala, icono };
    });
  }

  crearBurbuja() {
    this.burbuja = this.add.container(0, 0).setDepth(5000).setVisible(false);
    this.burbujaFondo = this.add.graphics();
    this.burbujaTexto = this.add.text(0, -26, '', T(20, '#1d2350', { align: 'center', wordWrap: { width: 270 } }))
      .setOrigin(0.5, 1);
    this.burbuja.add([this.burbujaFondo, this.burbujaTexto]);
  }

  crearControles() {
    this.teclas = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys('W,A,S,D');

    this.input.on('pointerdown', (p) => {
      if (this.bloqueado) return;
      const x = Phaser.Math.Clamp(p.worldX, ZONA.xMin, ZONA.xMax);
      const y = Phaser.Math.Clamp(p.worldY, ZONA.yMin, ZONA.yMax);
      this.destino = { x, y };
      const marca = this.add.circle(x, y, 12).setStrokeStyle(3, 0xffffff, 0.9).setScale(1, 0.5).setDepth(y - 2);
      this.tweens.add({ targets: marca, scaleX: 2.2, scaleY: 1.1, alpha: 0, duration: 450, onComplete: () => marca.destroy() });
    });
  }

  // ------------------------------------------------------------ misiones
  siguienteMision(primera) {
    this.objetivo = this.orden[this.indice];
    const u = this.objetivo;
    this.bloqueado = false;

    this.txtMision.setText(`Misión ${this.indice + 1} de ${this.orden.length}`);
    this.txtBusca.setText(`Busca ${u.articulo} ${u.nombre}`);
    this.iconoBusca.setTexture('util_' + u.id)
      .setScale(Dibujos.ajustar(this, 'util_' + u.id, 62))
      .setPosition(this.txtBusca.x - this.txtBusca.width / 2 - 48, 196)
      .setVisible(true);
    this.tweens.add({ targets: [this.txtMision, this.txtBusca, this.iconoBusca], alpha: { from: 0, to: 1 }, duration: 500 });

    this.decir(primera
      ? `¡Hola! Ayúdame a encontrar ${u.articulo} ${u.nombre}.`
      : `¡Ahora busquemos ${u.articulo} ${u.nombre}!`);
  }

  revisarUtiles(time) {
    for (const it of this.items) {
      if (it.recogido) continue;
      const dx = Math.abs(it.datos.x - this.pj.x);
      const dy = Math.abs(it.datos.y - this.pj.y);
      if (dx < 52 && dy < 36) {
        if (it.datos.id === this.objetivo.id) {
          this.recoger(it);
          return;
        }
        if (time > this.siguienteAviso) {
          this.siguienteAviso = time + 2600;
          const u = it.datos;
          this.decir(`Eso es ${u.articulo} ${u.nombre}. Busco ${this.objetivo.articulo} ${this.objetivo.nombre}.`);
          Sonido.aviso();
          this.tweens.add({ targets: it, angle: (u.angulo || 0) + 12, duration: 90, yoyo: true, repeat: 2 });
        }
      }
    }
  }

  recoger(it) {
    this.bloqueado = true;
    this.destino = null;
    it.recogido = true;
    this.tweens.killTweensOf([it, it.brillo]);
    it.brillo.destroy();
    it.sombra.destroy();
    Sonido.recoger();
    this.decir(`¡Encontré ${it.datos.articulo} ${it.datos.nombre}!`);

    const slot = this.slots[it.datos.id];
    it.setDepth(4000);
    this.tweens.chain({
      targets: it,
      tweens: [
        { y: it.y - 100, scale: 0.8, angle: 0, duration: 420, ease: 'Back.out' },
        { x: slot.x, y: slot.y + 8, scale: slot.escala, duration: 520, ease: 'Cubic.in', delay: 150 }
      ],
      onComplete: () => {
        it.destroy();
        slot.icono.setAlpha(1);
        this.tweens.add({ targets: slot.icono, scale: { from: slot.escala * 1.6, to: slot.escala }, duration: 300, ease: 'Back.out' });
        this.add.text(slot.x + 24, slot.y + 20, '✓', TZ(32, '#7CFC9A')).setOrigin(0.5);
        this.time.delayedCall(350, () => this.abrirActividad(it.datos));
      }
    });
  }

  abrirActividad(util) {
    this.burbuja.setVisible(false);
    this.scene.pause();
    this.scene.launch('Actividad', {
      util,
      alTerminar: (est) => this.actividadTerminada(est)
    });
  }

  actividadTerminada(est) {
    this.estrellas += est;
    this.txtEstrellas.setText('★ ' + this.estrellas);
    this.tweens.add({ targets: this.txtEstrellas, scale: { from: 1.5, to: 1 }, duration: 400, ease: 'Back.out' });
    this.indice++;

    if (this.indice >= this.orden.length) {
      this.decir('¡Encontré todos mis útiles!');
      this.time.delayedCall(1800, () => {
        this.cameras.main.fadeOut(500, 5, 8, 24);
        this.cameras.main.once('camerafadeoutcomplete', () => {
          this.scene.start('Final', { estrellas: this.estrellas, maximo: this.orden.length * 3 });
        });
      });
      return;
    }
    this.bloqueado = false;
    this.siguienteMision(false);
  }

  // ---------------------------------------------------- globo de diálogo
  decir(texto) {
    this.burbujaTexto.setText(texto);
    const w = Math.max(120, this.burbujaTexto.width + 30);
    const h = this.burbujaTexto.height + 22;
    const g = this.burbujaFondo;
    g.clear();
    g.fillStyle(0xffffff, 0.97).fillRoundedRect(-w / 2, -15 - h, w, h, 16);
    g.fillTriangle(-10, -16, 10, -16, 0, 0);
    g.lineStyle(2, 0x1d2350, 0.25).strokeRoundedRect(-w / 2, -15 - h, w, h, 16);
    this.burbuja.setVisible(true).setAlpha(1);
    this.posicionarBurbuja();
    this.tweens.add({ targets: this.burbuja, scale: { from: 0.7, to: 1 }, duration: 220, ease: 'Back.out' });

    if (this.timerBurbuja) this.timerBurbuja.remove();
    this.timerBurbuja = this.time.delayedCall(2800, () => {
      this.tweens.add({ targets: this.burbuja, alpha: 0, duration: 300, onComplete: () => this.burbuja.setVisible(false) });
    });
  }

  posicionarBurbuja() {
    const x = Phaser.Math.Clamp(this.pj.x, 170, 1110);
    this.burbuja.setPosition(x, this.pj.y - this.pj.displayHeight - 6);
  }

  // ------------------------------------------------------------- bucle
  update(time, dt) {
    if (this.bloqueado) {
      this.animarPaso(false, dt);
      this.posicionarBurbuja();
      return;
    }

    let vx = 0, vy = 0;
    const k = this.teclas, w = this.wasd;
    if (k.left.isDown || w.A.isDown) vx -= 1;
    if (k.right.isDown || w.D.isDown) vx += 1;
    if (k.up.isDown || w.W.isDown) vy -= 1;
    if (k.down.isDown || w.S.isDown) vy += 1;

    let paso = this.VELOCIDAD * dt / 1000;
    if (vx || vy) {
      this.destino = null;
    } else if (this.destino) {
      const dx = this.destino.x - this.pj.x;
      const dy = this.destino.y - this.pj.y;
      const d = Math.hypot(dx, dy);
      if (d < 3) {
        this.destino = null;
      } else {
        vx = dx; vy = dy;
        paso = Math.min(paso, d);
      }
    }

    const largo = Math.hypot(vx, vy);
    const moviendo = largo > 0;
    if (moviendo) {
      vx /= largo; vy /= largo;
      this.pj.x = Phaser.Math.Clamp(this.pj.x + vx * paso, ZONA.xMin, ZONA.xMax);
      this.pj.y = Phaser.Math.Clamp(this.pj.y + vy * paso, ZONA.yMin, ZONA.yMax);
      if (vx < -0.15) this.pj.setFlipX(true);
      if (vx > 0.15) this.pj.setFlipX(false);
    }

    this.animarPaso(moviendo, dt);
    this.ajustarPerspectiva();
    this.posicionarBurbuja();
    this.revisarUtiles(time);
  }

  animarPaso(moviendo, dt) {
    if (moviendo) {
      const antes = Math.floor(this.pasoT / 250);
      this.pasoT += dt;
      if (Math.floor(this.pasoT / 250) !== antes) Sonido.paso();
      this.pj.angle = Math.sin(this.pasoT / 80) * 6;
      this.rebote = Math.abs(Math.sin(this.pasoT / 80)) * 0.04;
    } else {
      this.pj.angle *= 0.8;
      this.rebote = 0;
    }
  }

  // Más grande cuando está adelante (abajo), más pequeño atrás.
  ajustarPerspectiva() {
    const t = (this.pj.y - ZONA.yMin) / (ZONA.yMax - ZONA.yMin);
    const s = 0.66 + 0.16 * t;
    this.pj.setScale(s, s * (1 + (this.rebote || 0)));
    this.pj.setDepth(this.pj.y + 0.5);
    this.sombraPj.setPosition(this.pj.x, this.pj.y).setScale(s * 1.15).setDepth(this.pj.y - 0.5);
  }
}

// ---- src/escenas/Actividad.js
// Ventana modal con la actividad del sistema solar.
// Se abre encima de la escena Juego (que queda en pausa).
class Actividad extends Phaser.Scene {
  constructor() { super('Actividad'); }

  init(data) {
    this.util = data.util;
    this.act = data.util.actividad;
    this.alTerminar = data.alTerminar;
    this.errores = 0;
    this.terminada = false;
    this.contenido = [];
  }

  create() {
    // Fondo oscuro que bloquea los clics hacia el aula
    const velo = this.add.rectangle(0, 0, 1280, 720, 0x050818, 0.62).setOrigin(0).setInteractive();

    const P = this.P = { x: 150, y: 50, w: 980, h: 620 };
    const g = this.add.graphics();
    g.fillStyle(COLOR.panel, 1).fillRoundedRect(P.x, P.y, P.w, P.h, 28);
    const rnd = new Phaser.Math.RandomDataGenerator(['cosmos']);
    for (let i = 0; i < 80; i++) {
      g.fillStyle(0xffffff, rnd.realInRange(0.12, 0.55))
        .fillCircle(rnd.between(P.x + 20, P.x + P.w - 20), rnd.between(P.y + 20, P.y + P.h - 20), rnd.realInRange(0.6, 1.8));
    }
    g.lineStyle(5, COLOR.borde, 1).strokeRoundedRect(P.x, P.y, P.w, P.h, 28);

    // Cabecera
    const u = this.util;
    this.add.image(P.x + 62, P.y + 58, 'util_' + u.id).setScale(Dibujos.ajustar(this, 'util_' + u.id, 62));
    this.add.text(P.x + 110, P.y + 38, `¡Encontraste ${u.articulo} ${u.nombre}!`, T(20, '#ffd84d')).setOrigin(0, 0.5);
    this.add.text(P.x + 110, P.y + 72, this.act.titulo, T(34, '#ffffff', { fontStyle: '600' })).setOrigin(0, 0.5);
    this.instruccion = this.add.text(640, P.y + 132, this.act.instruccion || '', T(22, '#b9c6ff', { align: 'center', wordWrap: { width: 860 } })).setOrigin(0.5);
    this.feedback = this.add.text(640, P.y + P.h - 34, '', T(24, '#ffffff')).setOrigin(0.5);

    const constructores = {
      opcion: this.armarOpcion,
      vf: this.armarVF,
      ordenar: this.armarOrdenar,
      identificar: this.armarIdentificar,
      arrastrar: this.armarArrastrar,
      clasificar: this.armarClasificar
    };
    (constructores[this.act.tipo] || this.armarOpcion).call(this, this.act);

    // Animación de entrada
    this.children.list.forEach(o => {
      if (o === velo) return;
      this.tweens.add({ targets: o, alpha: { from: 0, to: o.alpha }, y: { from: o.y + 18, to: o.y }, duration: 260, ease: 'Cubic.out' });
    });
    this.tweens.add({ targets: velo, alpha: { from: 0, to: 1 }, duration: 200 });
  }

  // ------------------------------------------------------------ helpers
  c(obj) { this.contenido.push(obj); return obj; }

  mensaje(texto, color = '#ffffff') {
    this.feedback.setText(texto).setColor(color);
    if (texto) this.tweens.add({ targets: this.feedback, scale: { from: 1.15, to: 1 }, duration: 200 });
  }

  bien(texto = '¡Correcto!') { Sonido.bien(); this.mensaje(texto, '#7CFC9A'); }

  mal(texto = 'Mmm... intenta otra vez') {
    this.errores++;
    Sonido.mal();
    this.mensaje(texto, '#ff9a9a');
  }

  sacudir(objs) {
    this.tweens.add({ targets: objs, x: '+=9', duration: 45, yoyo: true, repeat: 3 });
  }

  planeta(x, y, id, escala = 1) {
    return this.add.image(x, y, 'planeta_' + id).setScale(0.5 * escala);
  }

  // ------------------------------------------------- 1. opción múltiple
  armarOpcion(a) {
    this.c(this.add.text(640, 255, a.pregunta, T(34, '#ffffff', { align: 'center', wordWrap: { width: 820 } })).setOrigin(0.5));
    const pos = [[455, 375], [825, 375], [455, 470], [825, 470]];
    a.opciones.forEach((op, i) => {
      const b = UI.boton(this, pos[i][0], pos[i][1], op, { w: 330, h: 74, tam: 30 });
      b.partes().forEach(o => this.c(o));
      b.alClic(() => {
        if (this.terminada) return;
        b.activo = false;
        if (i === a.correcta) {
          b.setColor(COLOR.verde);
          this.bien();
          this.completar();
        } else {
          b.setColor(COLOR.rojo);
          this.sacudir(b.partes());
          this.mal();
        }
      });
    });
  }

  // ------------------------------------------------ 2. verdadero / falso
  armarVF(a) {
    let i = 0;
    let esperando = false;
    const total = a.afirmaciones.length;
    const contador = this.c(this.add.text(640, 228, '', T(20, '#8fa0e6')).setOrigin(0.5));
    const g = this.c(this.add.graphics());
    g.fillStyle(COLOR.tarjeta, 1).fillRoundedRect(290, 258, 700, 130, 20);
    g.lineStyle(3, COLOR.borde, 0.6).strokeRoundedRect(290, 258, 700, 130, 20);
    const texto = this.c(this.add.text(640, 323, '', T(34, '#ffffff', { align: 'center', wordWrap: { width: 640 } })).setOrigin(0.5));

    const bV = UI.boton(this, 500, 470, 'Verdadero', { w: 250, h: 78, color: 0x2a7fd4, tam: 30 });
    const bF = UI.boton(this, 780, 470, 'Falso', { w: 250, h: 78, color: 0xb8437a, tam: 30 });
    [...bV.partes(), ...bF.partes()].forEach(o => this.c(o));

    const mostrar = () => {
      contador.setText(`Frase ${i + 1} de ${total}`);
      texto.setText(a.afirmaciones[i].texto);
      this.tweens.add({ targets: texto, alpha: { from: 0, to: 1 }, duration: 250 });
      bV.reset(); bF.reset();
      esperando = false;
    };

    const responder = (valor, b) => {
      if (esperando || this.terminada) return;
      if (valor === a.afirmaciones[i].v) {
        esperando = true;
        b.setColor(COLOR.verde);
        this.bien();
        this.time.delayedCall(800, () => {
          i++;
          if (i >= total) this.completar(0);
          else { this.mensaje(''); mostrar(); }
        });
      } else {
        b.activo = false;
        b.setColor(COLOR.rojo);
        this.sacudir(b.partes());
        this.mal('No es así, piénsalo de nuevo');
      }
    };
    bV.alClic(() => responder(true, bV));
    bF.alClic(() => responder(false, bF));
    mostrar();
  }

  // ------------------------------------------------- 3. ordenar planetas
  armarOrdenar() {
    const sol = this.c(this.add.image(240, 330, 'sol').setScale(0.36));
    this.tweens.add({ targets: sol, angle: 360, duration: 20000, repeat: -1 });
    this.c(this.add.text(240, 395, 'Sol', T(20, '#ffd84d')).setOrigin(0.5));

    const g = this.c(this.add.graphics());
    const slots = PLANETAS.map((p, i) => {
      const x = 335 + i * 102;
      const y = 330;
      g.lineStyle(2, 0xffffff, 0.3).strokeCircle(x, y, 32);
      this.c(this.add.text(x, y, String(i + 1), T(22, '#5b6699')).setOrigin(0.5));
      return { x, y };
    });

    let siguiente = 0;
    const mezclados = Phaser.Utils.Array.Shuffle(PLANETAS.slice());
    mezclados.forEach((p, i) => {
      const x = 245 + i * 113;
      const y = 490;
      const img = this.c(this.planeta(x, y, p.id, 0.72).setInteractive({ useHandCursor: true }));
      const nombre = this.c(this.add.text(x, y + 48, p.nombre, T(18, '#dfe5ff')).setOrigin(0.5));
      img.on('pointerup', () => {
        if (this.terminada) return;
        if (p.id === PLANETAS[siguiente].id) {
          const s = slots[siguiente];
          img.disableInteractive();
          this.tweens.add({ targets: img, x: s.x, y: s.y, scale: 0.5 * 0.62, duration: 380, ease: 'Back.out' });
          this.tweens.add({ targets: nombre, x: s.x, y: s.y + (siguiente % 2 ? 54 : -50), duration: 380 });
          siguiente++;
          if (siguiente === PLANETAS.length) { this.bien('¡Sistema solar ordenado!'); this.completar(); }
          else this.bien(`¡Bien! Va ${p.nombre}. ¿Cuál sigue?`);
        } else {
          this.sacudir([img, nombre]);
          this.mal(`Ese no va todavía. ¿Cuál está más cerca del Sol?`);
        }
      });
    });
  }

  // ------------------------------------------- 4. identificar el planeta
  armarIdentificar(a) {
    let ronda = 0;
    let esperando = false;
    const contador = this.c(this.add.text(640, 225, '', T(20, '#8fa0e6')).setOrigin(0.5));
    const pregunta = this.c(this.add.text(640, 268, '', T(34, '#ffffff')).setOrigin(0.5));

    const mezclados = Phaser.Utils.Array.Shuffle(PLANETAS.slice());
    const imgs = {};
    mezclados.forEach((p, i) => {
      const x = 245 + i * 113;
      const y = 430;
      const img = this.c(this.planeta(x, y, p.id, 0.85).setInteractive({ useHandCursor: true }));
      imgs[p.id] = img;
      this.tweens.add({ targets: img, y: y - 6, duration: 1000 + i * 90, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
      img.on('pointerup', () => {
        if (esperando || this.terminada) return;
        if (p.id === a.rondas[ronda].correcta) {
          esperando = true;
          const aro = this.c(this.add.circle(x, y, p.r * 0.85 + 10).setStrokeStyle(4, 0x7CFC9A));
          this.c(this.add.text(x, y + 72, p.nombre, T(20, '#7CFC9A')).setOrigin(0.5));
          this.tweens.add({ targets: aro, scale: { from: 1.4, to: 1 }, duration: 300, ease: 'Back.out' });
          this.bien(`¡Sí! Es ${p.nombre}.`);
          this.time.delayedCall(900, () => {
            ronda++;
            if (ronda >= a.rondas.length) this.completar(0);
            else { this.mensaje(''); mostrar(); }
          });
        } else {
          this.sacudir(img);
          this.mal(`Ese es ${p.nombre}. Lee otra vez la pista.`);
        }
      });
    });

    const mostrar = () => {
      contador.setText(`Pista ${ronda + 1} de ${a.rondas.length}`);
      pregunta.setText(a.rondas[ronda].pregunta);
      this.tweens.add({ targets: pregunta, alpha: { from: 0, to: 1 }, duration: 250 });
      esperando = false;
    };
    mostrar();
  }

  // ------------------------------------- 5. arrastrar nombres a planetas
  armarArrastrar(a) {
    const xs = [310, 530, 750, 970];
    const objetivos = a.planetas.map((id, i) => {
      const x = xs[i];
      this.c(this.planeta(x, 300, id, 1));
      const g = this.c(this.add.graphics());
      g.lineStyle(2, 0xffffff, 0.35).strokeRoundedRect(x - 90, 392, 180, 54, 14);
      return { id, x, y: 419 };
    });

    let colocados = 0;
    const mezclados = Phaser.Utils.Array.Shuffle(a.planetas.slice());
    mezclados.forEach((id, i) => {
      const origen = { x: xs[i], y: 540 };
      const b = UI.boton(this, origen.x, origen.y, planetaPorId(id).nombre, { w: 176, h: 56, color: 0x5a3fc0, tam: 26 });
      b.partes().forEach(o => this.c(o));
      this.input.setDraggable(b.img);

      b.img.on('dragstart', () => { b.img.setDepth(10); b.txt.setDepth(11); });
      b.img.on('drag', (p, x, y) => b.mover(x, y));
      b.img.on('dragend', () => {
        const x = b.img.x, y = b.img.y;
        const destino = objetivos.find(o => Math.abs(o.x - x) < 105 && y > 230 && y < 480);
        if (!destino) {
          this.tweens.add({ targets: b.img, x: origen.x, y: origen.y, duration: 250, onUpdate: () => b.txt.setPosition(b.img.x, b.img.y - 3) });
          return;
        }
        if (destino.id === id && !destino.ocupado) {
          destino.ocupado = true;
          b.mover(destino.x, destino.y);
          b.setColor(COLOR.verde);
          b.activo = false;
          b.img.disableInteractive();
          colocados++;
          if (colocados === objetivos.length) { this.bien('¡Todos tienen su nombre!'); this.completar(); }
          else this.bien();
        } else {
          b.setColor(COLOR.rojo);
          this.mal('Ese nombre no corresponde a ese planeta.');
          this.tweens.add({
            targets: b.img, x: origen.x, y: origen.y, duration: 350,
            onUpdate: () => b.txt.setPosition(b.img.x, b.img.y - 3),
            onComplete: () => b.setColor(b.colorBase)
          });
        }
      });
    });
  }

  // -------------------------------------- 6. clasificar rocoso / gaseoso
  armarClasificar() {
    const cajas = [
      { tipo: 'rocoso', titulo: 'Rocosos', x: 410, color: 0x9fe870, n: 0 },
      { tipo: 'gaseoso', titulo: 'Gaseosos', x: 870, color: 0xffb35c, n: 0 }
    ];
    cajas.forEach(cj => {
      cj.rect = new Phaser.Geom.Rectangle(cj.x - 215, 365, 430, 215);
      const g = this.c(this.add.graphics());
      g.fillStyle(COLOR.tarjeta, 1).fillRoundedRect(cj.rect.x, cj.rect.y, cj.rect.width, cj.rect.height, 20);
      g.lineStyle(3, cj.color, 0.9).strokeRoundedRect(cj.rect.x, cj.rect.y, cj.rect.width, cj.rect.height, 20);
      this.c(this.add.text(cj.x, 392, cj.titulo, T(26, Phaser.Display.Color.IntegerToColor(cj.color).rgba, { fontStyle: '600' })).setOrigin(0.5));
    });

    let colocados = 0;
    const mezclados = Phaser.Utils.Array.Shuffle(PLANETAS.slice());
    mezclados.forEach((p, i) => {
      const origen = { x: 245 + i * 113, y: 252 };
      const img = this.c(this.planeta(origen.x, origen.y, p.id, 0.62));
      const nombre = this.c(this.add.text(origen.x, origen.y + 40, p.nombre, T(17, '#dfe5ff')).setOrigin(0.5));
      img.setInteractive({ useHandCursor: true, draggable: true });

      const seguir = () => nombre.setPosition(img.x, img.y + 40);
      img.on('dragstart', () => { img.setDepth(10); nombre.setDepth(10); });
      img.on('drag', (ptr, x, y) => { img.setPosition(x, y); seguir(); });
      img.on('dragend', () => {
        const caja = cajas.find(cj => cj.rect.contains(img.x, img.y));
        if (!caja) {
          this.tweens.add({ targets: img, x: origen.x, y: origen.y, duration: 250, onUpdate: seguir });
          return;
        }
        if (caja.tipo === p.tipo) {
          const k = caja.n++;
          img.disableInteractive();
          this.tweens.add({ targets: img, x: caja.x - 156 + k * 104, y: 470, duration: 250, ease: 'Back.out', onUpdate: seguir });
          colocados++;
          if (colocados === PLANETAS.length) { this.bien('¡Todos clasificados!'); this.completar(); }
          else this.bien(`¡Bien! ${p.nombre} es ${p.tipo}.`);
        } else {
          this.mal(`${p.nombre} no es ${caja.tipo}. Intenta de nuevo.`);
          this.tweens.add({ targets: img, x: origen.x, y: origen.y, duration: 350, onUpdate: seguir });
        }
      });
    });
  }

  // ------------------------------------------------------- resultado
  completar(espera = 700) {
    if (this.terminada) return;
    this.terminada = true;
    const est = Math.max(1, 3 - this.errores);

    this.time.delayedCall(espera + 300, () => {
      this.tweens.killTweensOf(this.contenido);
      this.tweens.add({
        targets: this.contenido, alpha: 0, duration: 250,
        onComplete: () => this.contenido.forEach(o => o.destroy())
      });
      this.instruccion.setText('');
      this.mensaje('');

      const titulo = est === 3 ? '¡Excelente!' : est === 2 ? '¡Muy bien!' : '¡Lo lograste!';
      [-1, 0, 1].forEach((d, i) => {
        const s = this.add.image(640 + d * 110, 270 - (d === 0 ? 14 : 0), i < est ? 'estrella' : 'estrellaVacia').setScale(0);
        this.tweens.add({ targets: s, scale: d === 0 ? 0.75 : 0.62, duration: 380, delay: 200 + i * 170, ease: 'Back.out',
          onStart: () => { if (i < est) Sonido.tono(660 + i * 180, 0.15, 'triangle', 0.12); } });
      });
      this.add.text(640, 365, titulo, T(42, '#ffd84d', { fontStyle: '600' })).setOrigin(0.5);

      const g = this.add.graphics();
      g.fillStyle(COLOR.tarjeta, 1).fillRoundedRect(270, 412, 740, 110, 18);
      this.add.text(300, 434, 'DATO CURIOSO', T(16, '#6fd3ff', { fontStyle: '600' })).setOrigin(0, 0.5);
      this.add.text(640, 476, this.act.dato || '', T(22, '#ffffff', { align: 'center', wordWrap: { width: 680 } })).setOrigin(0.5);

      const b = UI.boton(this, 640, 586, 'Continuar  ▶', { w: 280, h: 70, color: COLOR.verde, tam: 28 });
      b.alClic(() => this.cerrar(est));
    });
  }

  cerrar(est) {
    const cb = this.alTerminar;
    this.scene.resume('Juego');
    this.scene.stop();
    if (cb) cb(est);
  }
}

  <script>
// ---- src/escenas/Final.js
// Pantalla final con el puntaje.
class Final extends Phaser.Scene {
  constructor() { super('Final'); }

  init(data) {
    this.estrellas = data.estrellas || 0;
    this.maximo = data.maximo || 1;
  }

  create() {
    this.add.image(0, 0, 'fondo').setOrigin(0);
    this.add.rectangle(0, 0, 1280, 720, 0x050818, 0.55).setOrigin(0);

    const g = this.add.graphics();
    g.fillStyle(COLOR.panel, 1).fillRoundedRect(250, 80, 780, 560, 30);
    g.lineStyle(5, COLOR.borde, 1).strokeRoundedRect(250, 80, 780, 560, 30);

    const pj = this.add.image(420, 610, 'personaje', 'cuerpo').setOrigin(0.5, 1).setScale(1.15);
    this.tweens.add({ targets: pj, y: 585, duration: 420, yoyo: true, repeat: -1, ease: 'Sine.out' });

    const cx = 760;
    this.add.text(cx, 170, '¡Misión cumplida!', T(48, '#ffd84d', { fontStyle: '600' })).setOrigin(0.5);
    this.add.text(cx, 250, 'Encontraste todos tus útiles y aprendiste sobre el sistema solar.',
      T(24, '#dfe5ff', { align: 'center', wordWrap: { width: 420 } })).setOrigin(0.5);

    this.add.image(cx - 70, 355, 'estrella').setScale(0.9);
    this.add.text(cx - 20, 355, `${this.estrellas} / ${this.maximo}`, T(52, '#ffffff', { fontStyle: '600' })).setOrigin(0, 0.5);

    const r = this.estrellas / this.maximo;
    const frase = r >= 0.9 ? '¡Eres un astronauta experto!' : r >= 0.6 ? '¡Muy buen viaje espacial!' : '¡Buen trabajo! Juega otra vez para ganar más estrellas.';
    this.add.text(cx, 440, frase, T(24, '#7CFC9A', { align: 'center', wordWrap: { width: 420 } })).setOrigin(0.5);

    UI.boton(this, cx, 545, 'Jugar otra vez', { w: 300, h: 74, color: COLOR.verde })
      .alClic(() => this.scene.start('Juego'));

    this.add.particles(0, -10, 'confeti', {
      x: { min: 0, max: 1280 },
      speedY: { min: 120, max: 260 },
      speedX: { min: -60, max: 60 },
      rotate: { min: 0, max: 360 },
      scale: { min: 0.4, max: 0.8 },
      lifespan: 5000,
      frequency: 70,
      quantity: 2,
      tint: [0xffd23f, 0xe53935, 0x43a047, 0x1e88e5, 0xff8fb3, 0x6fd3ff]
    }).setDepth(10);

    this.cameras.main.fadeIn(500, 5, 8, 24);
    Sonido.fanfarria();
  }
}

</script>
  <script>
// ---- src/main.js
// Configuración e inicio del juego.
const config = {
  type: Phaser.AUTO,
  parent: 'juego',
  width: 1280,
  height: 720,
  backgroundColor: '#0f1630',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  // Carga las imágenes con <img> en vez de XHR: así también funciona
  // la versión de un solo archivo (imágenes incrustadas en base64).
  loader: { imageLoadType: 'HTMLImageElement' },
  scene: [Arranque, Carga, Juego, Actividad, Final]
};

// Esperamos las fuentes (máximo 2.5 s) para que los textos no salgan con otra letra.
const fuentesListas = Promise.all([
  document.fonts.load('32px "Fredoka"'),
  document.fonts.load('600 32px "Fredoka"'),
  document.fonts.load('32px "Patrick Hand"')
]).catch(() => {});

Promise.race([fuentesListas, new Promise(r => setTimeout(r, 2500))])
  .then(() => { window.juego = new Phaser.Game(config); });

</script>
